# 三平台出包：Android（arm64-v8a APK） / Windows（MSVC x64 zip） / macOS（dmg）
#
# 触发：push（master 与 feat/**）/ Pull Request / 手动 workflow_dispatch。
# 每个 job 在自己的 runner 上装 Qt（jurplel/install-qt-action，用 codeload
# 缓存），再 qt-cmake 配置 → 编译 appemuera → 收运行库 → 传 Artifacts。
#
# 几点说明（改这个文件前值得一看）：
#   * Qt 版本与本地开发环境对齐（作者本机 Qt 6.11.2，三平台同版本）。
#     注意项目实际下限就是 6.11（text_encoding.cpp 用了 Qt 6.11 才有的
#     QStringDecoder::finalize()），所以 CMakeLists 里也是 REQUIRES 6.11；
#     Windows 上它得靠 aqtinstall 的 git 源才能装上，见 windows job 的注释。
#   * 只编译 `appemuera` 目标，不跑单测：引擎单测里有 POSIX 专用代码
#     （test_cli.cpp 的 <unistd.h>，还有 socket/TCP harness），MSVC 下编不过。
#     三平台 CI 的目标是「应用能不能出包」，单测交给本地 Linux 跑。
#   * EMUERA_WARNINGS_AS_ERRORS=OFF：本地用 GCC 开发，MSVC / AppleClang
#     的告警集合不同，CI 只把告警打出来，不因为告警而失败（默认仍 ON）。
#   * Android 做的是 debug 签名 APK（androiddeployqt 默认用 debug key），
#     可直接装到手机；要发版再配 QT_ANDROID_SIGN_APK + keystore secrets。
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches:
      - master
      - 'feat/**'
    tags:
      - 'v*.*.*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# 同一分支连着推时，取消上一次还没跑完的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地开发环境对齐（作者本机 Qt 6.11.2）。
  # 注意：项目实际下限是 6.11 而不是 CMakeLists 里写的 6.10 ——
  # text_encoding.cpp 用了 QStringDecoder/QStringEncoder::finalize() 与
  # QStringConverter::FinalizeResultError，这两样 Qt 文档标注
  # "introduced in Qt 6.11"（改用 6.10.3 会在 MSVC/GCC 上报 C2039）。
  QT_VERSION: '6.11.2'
  # Python 交给 install-qt-action 自己管（它内部用 actions/setup-python，
  # 现在会拉到 3.14，而它的自查提示正好推荐 >=3.14：低版本在处理
  # zipfile/7z 时有文件类型识别 bug，见 aqtinstall#1042）。
  # qmlimportscanner 会在部署阶段读 QML 的 import：
  #   * QtMultimedia —— AudioPlayers.qml（MediaPlayer / SoundEffect）
  #   * qtimageformats —— eraTW 的 *.webp（libqwebp 插件）
  QT_MODULES: 'qtimageformats qtmultimedia'
  # 告警照打，但不因告警失败（见文件头说明）
  WARNINGS_FLAG: '-DEMUERA_WARNINGS_AS_ERRORS=OFF'

jobs:
  tests:
    name: Linux tests and QML lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DEMUERA_WARNINGS_AS_ERRORS=OFF
      - name: 编译测试目标
        run: cmake --build build --parallel
      - name: QML 静态检查
        run: cmake --build build --target all_qmllint
      - name: 运行 CTest
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --parallel 2

  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Qt ${{ env.QT_VERSION }}（Windows 用 aqtinstall master）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          # 从 Qt 6.11 起，Qt 的 Windows 仓库换了目录结构：
          #   .../windows_x86/desktop/qt6_6112/qt6_6112_msvc2022_64/Updates.xml
          # （不再有内层同名的 qt6_6112 目录），而 aqtinstall 最新正式版
          # 3.3.0（2025-06 发布）仍按老结构去找，于是报
          #   ERROR: Failed to locate XML data for Qt version '6.11.2'
          # 并以退出码 1 结束 —— 这正是之前 Windows 一直装不上 Qt 的原因
          # （aqtinstall#959；install-qt-action 的测试矩阵也把 6.11 的
          #  Windows 用例注释掉了）。
          # 修它的 PR #1000「Support Qt 6.11+ for Windows x64」在 2026-03
          # 就合进了 master，但至今没发版，所以这里直接从 git 源装。
          # 上游发了新版之后，删掉这一行即可（aqtsource 会覆盖 aqtversion）。
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: 配置（CMake + Visual Studio 2022，默认生成器）
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" ${{ env.WARNINGS_FLAG }}

      - name: 编译 appemuera
        shell: pwsh
        run: |
          # 编译输出落到 build.log：失败时下一步会把它里面的错误抛成 annotation
          cmake --build build --config Release --target appemuera --parallel > build.log 2>&1
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 30
          exit $code

      - name: 编译失败时汇总错误
        if: failure()
        shell: pwsh
        run: |
          # Actions 的原始日志只有仓库管理员能下载，这里把编译错误转成
          # annotation，任何人（含 API）都能在 Checks / 注解里看到。
          if (-not (Test-Path build.log)) { Write-Host "::error::没有生成 build.log"; exit 0 }
          $errs = Select-String -Path build.log -Pattern 'error [A-Z]+[0-9]+' |
                  ForEach-Object { $_.Line.Trim() } | Select-Object -Unique
          if ($errs) {
            $errs | Select-Object -First 8 | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Get-Content build.log -Tail 12 | ForEach-Object { Write-Host "::error::$_" }
          }

      - name: 收运行库（windeployqt）
        shell: pwsh
        run: |
          $exe = "build\Release\appemuera.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem build -Recurse -Filter appemuera.exe |
                    Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
                    Select-Object -First 1).FullName
          }
          Write-Host "exe = $exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist\
          # eraengine 已改为动态库（SHARED QML 模块）：windeployqt 只收 Qt 自己的
          # 运行库，项目自己的 DLL 得自己拷到 exe 旁边，否则解压后跑不起来。
          $dll = Get-ChildItem build -Recurse -Filter eraengine.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
                 Select-Object -First 1
          if ($dll) {
            Write-Host "dll = $($dll.FullName)"
            Copy-Item $dll.FullName dist\
          } else {
            Write-Host "警告：没找到 eraengine.dll（若 eraengine 又变回静态库可忽略）"
          }
          # 默认会带上 opengl32sw.dll（软渲染兜底）与所需 QML 插件
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations "dist\appemuera.exe"
          # eraTW 之类的游戏目录放进来即可直接双击运行
          New-Item -ItemType Directory -Force dist\game | Out-Null
          Copy-Item README.md dist\game\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath emuera-windows-x64.zip -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: emuera-windows-x64
          path: emuera-windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------------- macOS
  macos:
    name: macOS (AppleClang)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: 配置（CMake + Ninja）
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DEMUERA_WARNINGS_AS_ERRORS=OFF

      # QML 静态检查（qmllint）：零告警是项目口径（根目录 .qmllint.ini 的
      # MaxWarnings=0），所以出现新告警会在这里失败。用 Qt 自己生成的
      # all_qmllint 目标 —— 它按模块传好 import path，不需要手工 -I。
      # 放在 macOS job：与其它平台同为 Qt 6.11.2 桌面工具链（qmllint 随 Tools 安装）。
      - name: QML 静态检查（qmllint，零告警）
        run: cmake --build build --target all_qmllint

      - name: 编译 appemuera
        run: cmake --build build --target appemuera --parallel

      - name: 打包（macdeployqt -> dmg）
        run: |
          set -euo pipefail
          APP="$(find build -maxdepth 3 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then echo "没找到 .app" >&2; ls -R build | head -50; exit 1; fi
          echo "APP=$APP"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -dmg -always-overwrite
          ls -la "$(dirname "$APP")"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: emuera-macos-dmg
          path: |
            build/*.dmg
            build/**/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ Android
  android:
    name: Android arm64-v8a (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: JDK 17（androiddeployqt / Gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - name: 安装 Qt ${{ env.QT_VERSION }}（Android）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: 准备 Android SDK / NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "找不到 Android SDK: $SDK" >&2; exit 1; }

          # 优先用 runner 自带的 NDK；都没有才下载 Qt 文档里用的 r27c。
          # （若 Qt 抱怨 NDK 版本，把下面的 27.2.12479018 换成它要求的版本。）
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            echo "没有可用 NDK，通过 sdkmanager 安装 r27c"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi

          # Gradle 自己会补 compileSdk / build-tools，这里不预装
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "NDK = $NDK"
          command -v ninja > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y ninja-build)

      - name: 配置（qt-cmake + Ninja，android_arm64_v8a）
        run: |
          set -euo pipefail
          EXTRA=()
          # install-qt-action 面向 Android/iOS/WASM 会自动装好宿主 Qt 并设 QT_HOST_PATH
          [ -n "${QT_HOST_PATH:-}" ] && EXTRA+=(-DQT_HOST_PATH="$QT_HOST_PATH")
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEMUERA_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=TRUE \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: 编译 APK（cmake --build --target apk）
        run: cmake --build build --target apk

      - name: 校验 APK 并整理下载目录
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build -type f -path '*/outputs/apk/*/*.apk' | head -n 1)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo '未找到 APK' >&2; find build -type f -name '*.apk' -print; exit 1; }
          echo "APK=$APK"
          mkdir -p dist/android
          cp "$APK" dist/android/emuera-android-arm64-v8a-debug.apk
          # APK 本身是 ZIP：先验证目录结构和中央目录完整，再验证 debug 签名。
          unzip -t dist/android/emuera-android-arm64-v8a-debug.apk >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [ -x "$APKSIGNER" ] || { echo '找不到 apksigner' >&2; exit 1; }
          "$APKSIGNER" verify --verbose dist/android/emuera-android-arm64-v8a-debug.apk
          sha256sum dist/android/emuera-android-arm64-v8a-debug.apk | tee dist/android/SHA256SUMS
          ls -lh dist/android

      - name: 上传 APK（下载后解压即可得到可安装文件）
        uses: actions/upload-artifact@v4
        with:
          name: emuera-android-apk
          path: dist/android/emuera-android-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: 上传 APK 校验和
        uses: actions/upload-artifact@v4
        with:
          name: emuera-android-apk-checksum
          path: dist/android/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: [windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和与抗干扰压缩包
        run: |
          set -euo pipefail
          find dist -type f -print
          cd dist
          sha256sum *.apk *.zip *.dmg > SHA256SUMS
          tar --zstd -cf "emuera-${GITHUB_REF_NAME}.tar.zst" *.apk *.zip *.dmg SHA256SUMS
      - name: 发布 GitHub Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/*.zip
            dist/*.dmg
            dist/*.tar.zst
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ github.ref_name != 'v0.0.1' }}
