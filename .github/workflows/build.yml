# ---------------------------------------------------------------------------
# 三平台出包：Android（arm64-v8a APK） / Windows（MSVC x64 zip） / macOS（dmg）
#
# 触发：push（master 与 feat/**）/ Pull Request / 手动 workflow_dispatch。
# 每个 job 在自己的 runner 上装 Qt（jurplel/install-qt-action，用 codeload
# 缓存），再 qt-cmake 配置 → 编译 appemuera → 收运行库 → 传 Artifacts。
#
# 几点说明（改这个文件前值得一看）：
#   * Qt 版本与本地开发环境对齐（作者本机 Qt 6.11.2）；cmake_minimum 上
#     qt_standard_project_setup(REQUIRES 6.10) 要求 >= 6.10。
#   * 只编译 `appemuera` 目标，不跑单测：引擎单测里有 POSIX 专用代码
#     （test_cli.cpp 的 <unistd.h>，还有 socket/TCP harness），MSVC 下编不过。
#     三平台 CI 的目标是「应用能不能出包」，单测交给本地 Linux 跑。
#   * EMUERA_WARNINGS_AS_ERRORS=OFF：本地用 GCC 开发，MSVC / AppleClang
#     的告警集合不同，CI 只把告警打出来，不因为告警而失败（默认仍 ON）。
#   * Android 做的是 debug 签名 APK（androiddeployqt 默认用 debug key），
#     可直接装到手机；要发版再配 QT_ANDROID_SIGN_APK + keystore secrets。
# ---------------------------------------------------------------------------
name: build

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
  workflow_dispatch:

# 同一分支连着推时，取消上一次还没跑完的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.2'
  # install-qt-action 从 v4.4.1 起默认把 Python 拉到 3.14，而它要装的
  # aqtinstall 3.3.0 的依赖（py7zr==1.1.0）在 3.14 上没有预编译 wheel，
  # Windows runner 又没有 MSVC 环境去现场编译 —— pip 退出码 1，Qt 装不上
  # （上游：install-qt-action#344 / aqtinstall#1042）。三个平台统一钉 3.12，
  # 并用 setup-python: false 让 action 复用这个解释器。
  PYTHON_VERSION: '3.12'
  # qmlimportscanner 会在部署阶段读 QML 的 import：
  #   * QtMultimedia —— AudioPlayers.qml（MediaPlayer / SoundEffect）
  #   * qtimageformats —— eraTW 的 *.webp（libqwebp 插件）
  QT_MODULES: 'qtimageformats qtmultimedia'
  # 告警照打，但不因告警失败（见文件头说明）
  WARNINGS_FLAG: '-DEMUERA_WARNINGS_AS_ERRORS=OFF'

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows x64 (MSVC 2022)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          setup-python: false
          cache: true

      - name: 配置（CMake + Visual Studio 2022，默认生成器）
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" ${{ env.WARNINGS_FLAG }}

      - name: 编译 appemuera
        run: cmake --build build --config Release --target appemuera --parallel

      - name: 收运行库（windeployqt）
        shell: pwsh
        run: |
          $exe = "build\Release\appemuera.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem build -Recurse -Filter appemuera.exe |
                    Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
                    Select-Object -First 1).FullName
          }
          Write-Host "exe = $exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist\
          # 默认会带上 opengl32sw.dll（软渲染兜底）与所需 QML 插件
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations "dist\appemuera.exe"
          # eraTW 之类的游戏目录放进来即可直接双击运行
          New-Item -ItemType Directory -Force dist\game | Out-Null
          Copy-Item README.md dist\game\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath emuera-windows-x64.zip -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: emuera-windows-x64
          path: emuera-windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------------- macOS
  macos:
    name: macOS (AppleClang)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          setup-python: false
          cache: true

      - name: 配置（CMake + Ninja）
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DEMUERA_WARNINGS_AS_ERRORS=OFF

      - name: 编译 appemuera
        run: cmake --build build --target appemuera --parallel

      - name: 打包（macdeployqt -> dmg）
        run: |
          set -euo pipefail
          APP="$(find build -maxdepth 3 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then echo "没找到 .app" >&2; ls -R build | head -50; exit 1; fi
          echo "APP=$APP"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -dmg -always-overwrite
          ls -la "$(dirname "$APP")"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: emuera-macos-dmg
          path: |
            build/*.dmg
            build/**/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ Android
  android:
    name: Android arm64-v8a (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: JDK 17（androiddeployqt / Gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 Qt ${{ env.QT_VERSION }}（Android）
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          setup-python: false
          cache: true

      - name: 准备 Android SDK / NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "找不到 Android SDK: $SDK" >&2; exit 1; }

          # 优先用 runner 自带的 NDK；都没有才下载 Qt 文档里用的 r27c。
          # （若 Qt 抱怨 NDK 版本，把下面的 27.2.12479018 换成它要求的版本。）
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            echo "没有可用 NDK，通过 sdkmanager 安装 r27c"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi

          # Gradle 自己会补 compileSdk / build-tools，这里不预装
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "NDK = $NDK"
          command -v ninja > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y ninja-build)

      - name: 配置（qt-cmake + Ninja，android_arm64_v8a）
        run: |
          set -euo pipefail
          EXTRA=()
          # install-qt-action 面向 Android/iOS/WASM 会自动装好宿主 Qt 并设 QT_HOST_PATH
          [ -n "${QT_HOST_PATH:-}" ] && EXTRA+=(-DQT_HOST_PATH="$QT_HOST_PATH")
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEMUERA_WARNINGS_AS_ERRORS=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: 编译 APK（cmake --build --target apk）
        run: cmake --build build --target apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: emuera-android-apk
          path: |
            build/android-build/build/outputs/apk/**/*.apk
            build/android-build-*/build/outputs/apk/**/*.apk
          if-no-files-found: error
