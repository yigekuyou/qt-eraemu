# emuera —— QML 静态检查（qmllint）项目口径
#
# 目标：QML 零告警。qmllint 的 info 级消息（例如未使用的 import）不影响退出码，
# 所以 [General] MaxWarnings=0 等价于「出现任何 warning 就让 lint 失败」。
#
# 用法（qmllint 会从被检查文件所在目录逐级向上找这个文件）：
#   cmake --build <build> --target all_qmllint      # 全部模块
#   cmake --build <build> --target appemuera_qmllint
#   qmllint -I <build> src/qml/*.qml                # 手工单跑
#
# 依据：Qt 文档《qmllint》（Settings / QML Lint Warning and Errors）；
# 各条告警的修复口径见 src/qml/*.qml 文件头的注释。
[General]
MaxWarnings=0

[Warnings]
# 这里的值就是 Qt 默认值，显式写出来是为了「改口径时一眼看到改了哪条」。
UnqualifiedAccess=warning
ContextProperties=warning
MissingType=warning
MissingProperty=warning
IncompatibleType=warning
RequiredProperty=warning
UnusedImports=info
